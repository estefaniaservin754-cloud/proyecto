<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  
  <title>Captura de Datos</title>
</head>
<body>

  <h2>Captura de Datos</h2>

  <form id="formulario" action="https://script.google.com/macros/s/AKfycbwvao5WQUfDbb8ylH0v-mGMaTkt2lxEXaZTwEA_eBpcP5h6GTqVp_h7pvYc01bcvP1n/exec" method="POST" target="hidden_iframe" onsubmit="enviado()">
    <label for="nombre">Nombre:</label><br>
    <input type="text" id="nombre" name="nombre" required><br><br>

    <label for="edad">Edad:</label><br>
    <input type="number" id="edad" name="edad" required min="1" max="120"><br><br>

    <label for="direccion">Direccion:</label><br>
    <input type="text" id="direccion" name="direccion" required><br><br>

    <label for="ano">Año escolar:</label><br>
     <input type="number" id="ano" name="ano" required min="6" max="13"><br><br>

<label for="curp">CURP:</label><br>
    <input type="text" id="curp" name="curp" required><br><br>

<label for="guardian">Nombre de padre/guardian:</label><br>
    <input type="text" id="guardian" name="guardian" required><br><br>

<label for="promedio">Ingrese prodemio general redondeando:</label><br>
    <input type="number" id="promedio" name="promedio" required min="1" max="10"><br><br>


    <button type="submit" id="btnEnviar">Enviar</button>
  </form>

  <p id="estado"></p>

  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

  <script>
    function enviado() {
      document.getElementById('btnEnviar').disabled = true;
      document.getElementById('estado').textContent = 'Guardando...';
      
      setTimeout(function() {
        document.getElementById('estado').textContent = '¡Registro guardado con éxito!';
        document.getElementById('formulario').reset();
        document.getElementById('btnEnviar').disabled = false;
      }, 1500);
    }
  </script>

</body>
</html>
